<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

    <header class="app-header">
        <div>
            <p class="eyebrow">Hoy</p>
            <h1>Registrar entrenamiento</h1>
        </div>
        <div class="avatar">FG</div>
    </header>

    <main class="main-content">

        <section class="quick-card">
            <h2>Ejercicios recientes</h2>
            <div class="chips">
                <button>Press banca</button>
                <button>Sentadilla</button>
                <button>Remo polea</button>
                <button>Press militar</button>
            </div>
        </section>

        <section class="card">
            <div class="card-header">
                <div>
                    <p class="eyebrow">Nueva serie</p>
                    <h2>Datos de la serie</h2>
                </div>
                <span class="serie-pill">Serie 1</span>
            </div>

            <div class="field">
                <label for="date">Fecha</label>
                <input type="date" id="date">
            </div>

            <div class="field">
                <label for="exercise">Ejercicio</label>
                <input 
                    type="text" 
                    id="exercise"
                    placeholder="Ej: press banca"
                >
            </div>

            <div class="row">
                <div class="field">
                    <label for="weight">Peso</label>
                    <div class="input-unit">
                        <input type="number" id="weight" placeholder="80">
                        <span>kg</span>
                    </div>
                </div>

                <div class="field">
                    <label for="reps">Reps</label>
                    <input type="number" id="reps" placeholder="8">
                </div>
            </div>

            <div class="quick-actions">
                <button>-2.5 kg</button>
                <button>+2.5 kg</button>
                <button>+1 rep</button>
                <button>Repetir</button>
            </div>

            <div class="field">
                <label for="notes">Notas</label>
                <textarea 
                    id="notes"
                    rows="3"
                    placeholder="Opcional: sensaciones, RIR, tecnica..."
                ></textarea>
            </div>

            <button class="save-btn">Guardar serie</button>
        </section>

        <section class="today-card">
            <div class="section-title">
                <h2>Entrenamiento de hoy</h2>
                <span>3 series</span>
            </div>

            <div class="exercise-block">
                <h3>Press banca</h3>

                <div class="set-row">
                    <span>Serie 1</span>
                    <strong>80 kg x 8</strong>
                </div>

                <div class="set-row">
                    <span>Serie 2</span>
                    <strong>80 kg x 7</strong>
                </div>

                <div class="set-row">
                    <span>Serie 3</span>
                    <strong>77.5 kg x 8</strong>
                </div>
            </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <a href="#" class="active">Registrar</a>
        <a href="#">Historial</a>
        <a href="#">Stats</a>
    </nav>

</div>

</body>
</html>
