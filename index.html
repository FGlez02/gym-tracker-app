<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="app">

        <header class="header">
            <h1>Gym Tracker</h1>
            <p>Registro rapido de entrenamiento</p>
        </header>

        <main>

            <section class="card">

                <div class="field">
                    <label for="date">Fecha</label>
                    <input type="date" id="date">
                </div>

                <div class="field">
                    <label for="exercise">Ejercicio</label>
                    <input 
                        type="text" 
                        id="exercise"
                        placeholder="Ej: press banca"
                    >
                </div>

                <div class="row">

                    <div class="field">
                        <label for="weight">Peso (kg)</label>
                        <input 
                            type="number"
                            id="weight"
                            placeholder="80"
                        >
                    </div>

                    <div class="field">
                        <label for="reps">Reps</label>
                        <input 
                            type="number"
                            id="reps"
                            placeholder="8"
                        >
                    </div>

                </div>

                <div class="field">
                    <label for="notes">Notas</label>
                    <textarea 
                        id="notes"
                        rows="3"
                        placeholder="Opcional"
                    ></textarea>
                </div>

                <button class="save-btn">
                    Guardar serie
                </button>

            </section>

        </main>

    </div>

</body>
</html>
